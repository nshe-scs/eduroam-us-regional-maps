name: Update eduroam maps

on:
  schedule:
    # 06:17 UTC daily. Deliberately not on the hour: GitHub's scheduler is
    # busiest then and routinely delays runs by tens of minutes.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every region and bypass the safety guards"
        type: boolean
        default: false

# Only one writer at a time. A manual run must never race the nightly one,
# because both commit to the same branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDUROAM_OUTPUT_DIR: docs
      EDUROAM_STATE_DIR: state

    steps:
      - name: Check out
        uses: actions/checkout@v4
        # Shallow is fine: the job only ever adds a commit on top of the tip.
        # The push step deepens the clone itself if it has to rebase.

      - name: Build maps
        id: build
        env:
          EDUROAM_FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          # -v sends the run log to stderr (and so to this job log) while the
          # one-line summary stays on stdout for the commit message.
          summary=$(python3 ./eduroam_maps.py -v)
          echo "summary=${summary:-No changes.}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$EDUROAM_OUTPUT_DIR" "$EDUROAM_STATE_DIR"
          if git diff --cached --quiet; then
            echo "Nothing changed; no commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "Update eduroam service location maps" -m "$SUMMARY"

          # The concurrency group serialises our own runs, so a rejected push
          # means a human pushed meanwhile. Deepen, rebase the single commit
          # onto the new tip, and retry once.
          if ! git push origin "HEAD:$BRANCH"; then
            echo "Push rejected; rebasing onto the current tip."
            git fetch --unshallow origin "$BRANCH" 2>/dev/null || git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi

          {
            echo "### $SUMMARY"
            echo
            echo "Committed \`$(git rev-parse --short HEAD)\`:"
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
